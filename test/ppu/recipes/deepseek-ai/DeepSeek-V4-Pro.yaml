schema_version: ppu-serving/v1
ppu:
  framework: sglang
  visibility: public
  assets: {model: deepseek-v4-pro-mxfp4, tokenizer: deepseek-v4-pro-mxfp4}
  hf_model_id: T-HEAD/DeepSeek-V4-Pro-0813-MoE-Quant-W-MXFP4-A-MXFP4-Dense-Quant-W-FP8-PerChannel-A-FP8-PerToken
  golden_model_key: deepseek_v4_pro_mxfp4
  topology: {kind: single_node, nodes: 1, devices_per_node: 8}
  external_env: [DG_USE_MOE_DYNAMIC_TILE, HGGC_EMBEDDED_COPY_THRESHOLD]
model:
  model_id: deepseek-ai/DeepSeek-V4-Pro
  base_args:
    - --tp-size
    - "8"
    - --attention-backend
    - dsv4
    - --page-size
    - "256"
    - --context-length
    - "16384"
    - --mem-fraction-static
    - "0.9"
    - --chunked-prefill-size
    - "8192"
    - --cuda-graph-max-bs-decode
    - "16"
    - --disable-prefill-cuda-graph
    - --kv-cache-dtype
    - fp8_e4m3
    - --reasoning-parser
    - deepseek-v4
    - --disable-custom-all-reduce
    - --disable-shared-experts-fusion
    - --trust-remote-code
  base_env:
    DG_USE_MOE_DYNAMIC_TILE: "1"
    HGGC_EMBEDDED_COPY_THRESHOLD: "0x10000"
variants:
  default: {precision: mxfp4}
