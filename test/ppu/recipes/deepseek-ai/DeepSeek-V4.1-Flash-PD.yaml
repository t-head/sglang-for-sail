      - "4"
      - --mem-fraction-static
      - "0.7"
      - --chunked-prefill-size
      - "39936"
      - --max-prefill-tokens
      - "19968"
      - --max-running-requests
      - "96"
      - --schedule-policy
      - hrrn
      - --disable-overlap-schedule
      - --enable-request-time-stats-logging
      - --dsv4-prefill-backend
