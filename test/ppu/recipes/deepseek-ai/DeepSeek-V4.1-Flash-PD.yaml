  MC_TE_METRIC: "1"
  MC_NUM_QP_PER_EP: "4"
  SGLANG_OPT_FUSED_Q_A_RMSNORM_QUANT: "1"
  NCCL_CUMEM_ENABLE: "1"
  SGLANG_WARMUP_TIMEOUT: "3600"
  SGLANG_OPT_FLASHMLA_SPARSE_PREFILL: "1"
  SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: "1"
  SGLANG_DSV4_KV_LAYOUT: auto
  SGLANG_ENABLE_JIT_DEEPGEMM: "1"
  SGLANG_JIT_DEEPGEMM_PRECOMPILE: "1"
  SGLANG_JIT_DEEPGEMM_FAST_WARMUP: "0"
  PYTHONUNBUFFERED: "1"
  SGLANG_ENABLE_CACHELINK: "0"
  MC_FORCE_HCA: "1"
  MOONCAKE_PROTOCOL: rdma
  SGLANG_USE_MODELSCOPE: "1"
common_args:
