  - --page-size
  - "64"
  - --tp-size
  - "4"
  - --moe-a2a-backend
  - megamoe
  - --moe-dense-tp-size
  - "1"
  - --disaggregation-transfer-backend
  - mooncake
  - --kv-cache-dtype
  - fp8_e4m3
  - --enable-deepseek-v4-fp4-indexer
  - --enable-decoder-swa-bounded-replay
  - --speculative-algorithm
  - DSPARK
  - --speculative-attention-mode
  - decode
  - --speculative-dspark-block-size
