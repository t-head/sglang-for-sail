      SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: shared
      DG_USE_MOE_DYNAMIC_TILE: "1"
      SGLANG_OPT_USE_JIT_NORM: "1"
      SGLANG_DSV4_USE_NATIVE_MXFP4_MOE: "1"
      SGLANG_OPT_DSV4_INDEXER_TP_SHARD: "1"
      SGLANG_OPT_PPU_DSV4_NATIVE_DECODE_HEADS: "1"
      SGLANG_OPT_PPU_DSV41_PREFILL_INDEXER_NATIVE: "1"
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "2400"
      WORKER_ROLE: decode-only
router:
  node: worker
  host: 127.0.0.1
  port: 8008
  metrics_host: 127.0.0.1
  metrics_port: 8010
  args:
    - --pd-disaggregation
    - --mini-lb
    - --policy
    - cache_aware
