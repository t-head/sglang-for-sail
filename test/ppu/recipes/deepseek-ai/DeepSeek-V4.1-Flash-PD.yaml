    devices: [4, 5, 6, 7]
    host: 0.0.0.0
    port: 2256
    nccl_port: 2257
    bootstrap_port: 2286
    args:
      - --disaggregation-mode
      - decode
      - --enable-dp-attention
      - --dp-size
      - "4"
      - --enable-dp-lm-head
      - --load-balance-method
      - total_tokens
      - --mem-fraction-static
      - "0.75"
      - --cuda-graph-max-bs-decode
      - "64"
      - --chunked-prefill-size
      - "8192"
      - --max-running-requests
      - "128"
