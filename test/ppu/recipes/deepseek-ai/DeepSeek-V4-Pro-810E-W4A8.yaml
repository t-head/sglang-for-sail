# Source: framework_ci_cases/sglang/dpsk-v4-pro-cases.md, sections 2.1.1.2 and 2.1.2.2.
schema_version: ppu-serving/v1
ppu:
  framework: sglang
  visibility: public
  assets: {model: deepseek-v4-pro-810e-w4a8, tokenizer: deepseek-v4-pro-810e-w4a8}
  hf_model_id: T-HEAD/DeepSeek-V4-Pro-0813-MoE-Quant-W-INT4-PerChannel-A-INT8-PerToken-Dense-Quant-W-INT8-PerChannel-A-INT8-PerToken
  topology: {kind: single_node, nodes: 1, devices_per_node: 16}
model:
  model_id: deepseek-ai/DeepSeek-V4-Pro
  base_args:
    - --trust-remote-code
    - --tp-size
    - "16"
    - --dist-timeout
    - "60000"
    - --watchdog-timeout
    - "60000"
    - --soft-watchdog-timeout
    - "60000"
    - --cuda-graph-max-bs-decode
    - "64"
    - --mem-fraction-static
    - "0.8"
    - --cuda-graph-backend-prefill
    - disabled
    - --fp8-gemm-backend
    - triton
    - --disable-shared-experts-fusion
    - --disable-custom-all-reduce
    - --tool-call-parser
    - deepseekv4
    - --reasoning-parser
    - deepseek-v4
    - --speculative-algorithm
    - DSPARK
    - --speculative-attention-mode
    - decode
    - --speculative-dspark-block-size
    - "5"
  base_env:
    SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "256"
    SGLANG_DSV4_FP4_EXPERTS: "0"
    SGLANG_OPT_USE_TOPK_V2: "0"
    SGLANG_SAIL_DSV4_USE_FLASH_MLA_SPARSE_FWD: "0"
variants:
  default: {precision: w4a8}
