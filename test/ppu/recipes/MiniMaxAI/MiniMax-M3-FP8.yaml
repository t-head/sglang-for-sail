schema_version: ppu-serving/v1
ppu:
  framework: sglang
  visibility: public
  assets: {model: minimax-m3-fp8, tokenizer: minimax-m3-fp8}
  hf_model_id: T-HEAD/MiniMax-M3-Quant-W-FP8-PerChannel-A-FP8-PerToken
  golden_model_key: minimax_m3_fp8
  topology: {kind: single_node, nodes: 1, devices_per_node: 8}
model:
  model_id: MiniMaxAI/MiniMax-M3
  base_args:
    - --tp-size
    - "8"
    - --trust-remote-code
    - --mem-fraction-static
    - "0.9"
    - --attention-backend
    - fa3
    - --page-size
    - "128"
    - --kv-cache-dtype
    - fp8_e4m3
    - --moe-runner-backend
    - deep_gemm
variants:
  default: {precision: fp8}
features:
  one_batch:
    args: [--disable-shared-experts-fusion, --cuda-graph-backend-prefill, disabled]
presets:
  one_batch_prefill:
    select: {features: {one_batch: true}}
    remove_args: [--page-size, --kv-cache-dtype]
    args: [--max-total-tokens, "106496"]
  one_batch_decode:
    select: {features: {one_batch: true}}
    remove_args: [--page-size, --kv-cache-dtype]
    args:
      - --chunked-prefill-size
      - "8192"
      - --cuda-graph-max-bs-decode
      - "64"
      - --max-total-tokens
      - "360448"
