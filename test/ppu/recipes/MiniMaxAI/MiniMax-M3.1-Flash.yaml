schema_version: ppu-serving/v1
ppu:
  framework: sglang
  visibility: public
  assets: {model: minimax-m3.1-flash-fp8, tokenizer: minimax-m3.1-flash-fp8}
  hf_model_id: T-HEAD/MiniMax-M3.1-Flash-Quant-W-FP8-PerChannel-A-FP8-PerToken
  topology: {kind: single_node, nodes: 1, devices_per_node: 8}
model:
  model_id: MiniMaxAI/MiniMax-M3.1-Flash
  base_args:
    - --tp-size
    - "8"
    - --mem-fraction-static
    - "0.9"
    - --attention-backend
    - fa3
    - --page-size
    - "128"
    - --kv-cache-dtype
    - fp8_e4m3
    - --moe-runner-backend
    - deep_gemm
    - --disable-shared-experts-fusion
    - --cuda-graph-max-bs-decode
    - "16"
    - --disable-prefill-cuda-graph
    - --reasoning-parser
    - auto
    - --tool-call-parser
    - auto
    - --trust-remote-code
variants:
  default: {precision: fp8}
