schema_version: ppu-serving/v1
ppu:
  framework: sglang
  visibility: public
  assets: {model: glm-5.3-flash-mxfp4, tokenizer: glm-5.3-flash-mxfp4}
  hf_model_id: T-HEAD/GLM-5.3-Flash-MoE-Quant-W-MXFP4-A-MXFP4-Dense-Quant-W-FP8-PerChannel-A-FP8-PerToken
  topology: {kind: single_node, nodes: 1, devices_per_node: 2}
model:
  model_id: zai-org/GLM-5.3-Flash
  base_args:
    - --tp-size
    - "2"
    - --context-length
    - "16384"
    - --dsa-prefill-backend
    - flashmla_sparse
    - --dsa-decode-backend
    - flashmla_sparse
    - --kv-cache-dtype
    - bfloat16
    - --disable-custom-all-reduce
    - --trust-remote-code
variants:
  default: {precision: mxfp4}
