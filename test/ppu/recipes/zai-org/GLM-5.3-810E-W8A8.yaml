# Source: framework_ci_cases/sglang/glm-5.3-cases.md, sections 2.1.1.1 and 2.1.2.1.
schema_version: ppu-serving/v1
ppu:
  framework: sglang
  visibility: public
  assets: {model: glm-5.3-810e-w8a8, tokenizer: glm-5.3-810e-w8a8}
  hf_model_id: T-HEAD/GLM-5.3-Quant-W-INT8-PerChannel-A-INT8-PerToken
  topology: {kind: single_node, nodes: 1, devices_per_node: 16}
  external_env: [SGLANG_NSA_DUAL_STREAM]
model:
  model_id: zai-org/GLM-5.3
  base_args:
    - --trust-remote-code
    - --tp-size
    - "16"
    - --mem-fraction-static
    - "0.9"
    - --quantization
    - "w8a8_int8"
    - --speculative-algorithm
    - "EAGLE"
    - --speculative-attention-mode
    - "decode"
    - --speculative-num-steps
    - "2"
    - --speculative-eagle-topk
    - "1"
    - --speculative-num-draft-tokens
    - "3"
    - --prefill-attention-backend
    - "fa3"
    - --decode-attention-backend
    - "flashmla"
    - --disable-shared-experts-fusion
    - --reasoning-parser
    - "glm45"
    - --tool-call-parser
    - "glm47"
    - --num-continuous-decode-steps
    - "1"
    - --enforce-disable-flashinfer-allreduce-fusion
    - --cuda-graph-max-bs-decode
    - "40"
    - --max-running-requests
    - "40"
    - --cuda-graph-backend-prefill
    - "disabled"
  base_env:
    SGLANG_DISABLE_DSA_INDEXER_FUSION: "1"
    SGLANG_NSA_FLASHMLA_BACKEND_DECODE_COMPUTE_FP8: "0"
variants:
  default: {precision: w8a8}
presets:
  fast_sanity:
    args:
      - --dist-timeout
      - "3600"
      - --watchdog-timeout
      - "3600"
    env:
      SGLANG_NSA_DUAL_STREAM: "0"
  model_sanity:
    args:
      - --dist-timeout
      - "24000"
      - --watchdog-timeout
      - "24000"
      - --moe-dense-tp-size
      - "1"
      - --enable-dp-lm-head
      - --moe-a2a-backend
      - "deepep"
      - --deepep-mode
      - "auto"
      - --disable-custom-all-reduce
      - --attn-dp-size
      - "8"
