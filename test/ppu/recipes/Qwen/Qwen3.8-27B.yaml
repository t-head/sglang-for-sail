schema_version: ppu-serving/v1
ppu:
  framework: sglang
  visibility: public
  assets: {model: qwen3.8-27b, tokenizer: qwen3.8-27b}
  hf_model_id: Qwen/Qwen3.8-27B
  topology: {kind: single_node, nodes: 1, devices_per_node: 2}
model:
  model_id: Qwen/Qwen3.8-27B
  base_args:
    - --tp-size
    - "2"
    - --dtype
    - bfloat16
    - --context-length
    - "16384"
    - --disable-custom-all-reduce
    - --trust-remote-code
variants:
  default: {precision: bf16}
hardware_overrides:
  zhenwu_810e:
    extra_args: [--tp-size, "1"]
features:
  one_batch:
    args:
      - --attention-backend
      - fa3
      - --page-size
      - "64"
      - --disable-shared-experts-fusion
      - --mamba-ssm-dtype
      - bfloat16
presets:
  one_batch_prefill:
    select: {features: {one_batch: true}}
    remove_args: [--context-length]
    args:
      - --mem-fraction-static
      - "0.7"
      - --max-total-tokens
      - "106496"
  one_batch_decode:
    select: {features: {one_batch: true}}
    remove_args: [--context-length]
    args:
      - --mem-fraction-static
      - "0.8"
