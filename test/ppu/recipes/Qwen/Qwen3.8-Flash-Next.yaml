schema_version: ppu-serving/v1
ppu:
  framework: sglang
  visibility: public
  assets: {model: qwen3.8-flash-next-mxfp4, tokenizer: qwen3.8-flash-next-mxfp4}
  hf_model_id: T-HEAD/Qwen3.8-Flash-Next-MoE-Quant-W-MXFP4-A-MXFP4-Dense-Quant-W-FP8-PerChannel-A-FP8-PerToken
  golden_model_key: qwen3.8-flash-next-dp8-ep
  topology: {kind: single_node, nodes: 1, devices_per_node: 8}
model:
  model_id: Qwen/Qwen3.8-Flash-Next
  base_args:
    - --tp-size
    - "8"
    - --attn-dp-size
    - "8"
    - --enable-dp-lm-head
    - --moe-a2a-backend
    - deepep
    - --moe-dense-tp-size
    - "1"
    - --attention-backend
    - triton
    - --mem-fraction-static
    - "0.9"
    - --max-running-requests
    - "128"
    - --chunked-prefill-size
    - "8192"
    - --speculative-algorithm
    - NEXTN
    - --speculative-num-steps
    - "2"
    - --speculative-eagle-topk
    - "1"
    - --linear-attn-prefill-backend
    - triton
    - --linear-attn-decode-backend
    - triton
    - --linear-attn-verify-backend
    - triton
    - --mamba-ssm-dtype
    - bfloat16
    - --ple-offload-embedding
    - --reasoning-parser
    - auto
    - --trust-remote-code
variants:
  default: {precision: mxfp4}
presets:
  model_sanity:
    args:
      - --page-size
      - "64"
      - --mamba-radix-cache-strategy
      - extra_buffer
