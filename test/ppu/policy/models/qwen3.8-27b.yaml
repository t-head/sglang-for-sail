schema_version: ppu-test-policy/v1
model_id: Qwen/Qwen3.8-27B
recipe: test/ppu/recipes/Qwen/Qwen3.8-27B.yaml
hardware: zhenwu_m890
tiers:
  fast_sanity:
    dummy_weights: true
    cache: enabled
    probe:
      prompt: "Compute 6 * 7 and reply with the integer only."
      max_tokens: 16
      temperature: 0.0
  light_perf:
    engine: one_batch
    hardware: zhenwu_m890
    variant: default
    dummy_weights: true
    # Smoke floors for the pilot. Calibrate regression thresholds on 890P.
    cases:
      - id: qwen3_8_27b_bf16_tp2_prefill
        preset: one_batch_prefill
        input: {batch_size: 1, input_len: [4096, 16384, 65536, 102400], output_len: 1}
        threshold: {metric: prefill_throughput, min_tokens_per_s: 1}
      - id: qwen3_8_27b_bf16_tp2_decode
        preset: one_batch_decode
        input: {batch_size: 16, input_len: [4096], output_len: 1536}
        threshold: {metric: median_decode_throughput, min_tokens_per_s: 1}
