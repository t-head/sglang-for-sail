schema_version: ppu-test-policy/v1
model_id: zai-org/GLM-5.3-Flash
recipe: test/ppu/recipes/zai-org/GLM-5.3-Flash.yaml
hardware: zhenwu_m890
accuracy_gate:
  method: golden_band
  golden_band_abs: 0.02
  golden_source: framework_repo
  save_per_question: true
tiers:
  fast_sanity:
    dummy_weights: true
    cache: enabled
    probe:
      prompt: "Compute 6 * 7 and reply with the integer only."
      max_tokens: 16
      temperature: 0.0
  model_sanity:
    stages:
      - id: sanity
        kind: sanity
        cache: enabled
        probe:
          prompt: "Compute 6 * 7 and reply with the integer only."
          expected_substring: "42"
          max_tokens: 128
          temperature: 0.0
          seed: 42
      - id: eval-gsm8k
        kind: evalscope
        cache: enabled
        dataset: gsm8k@2026-11
        limit: null
        seed: 42
        eval_batch_size: 128
        generation:
          temperature: 1.0
          top_p: 1.0
          max_tokens: 10240
      - id: bench-micro
        kind: bench
        cache: enabled
        cache_mode: sanity_throughput_guard
        engine: sglang_bench
        input:
          source: client_random
          input_length: 4096
          output_length: 512
          range_ratio: 1.0
        concurrencies:
          - 1
          - 16
        request_count_by_concurrency:
          1: 8
          16: 32
        warmup_count_by_concurrency:
          1: 2
          16: 8
  light_perf:
    engine: one_batch
    hardware: zhenwu_m890
    variant: default
    dummy_weights: true
    cases:
      - id: glm_5_3_flash_mxfp4_fp8_tp_prefill
        preset: one_batch_prefill
        input: {batch_size: 1, input_len: [4096, 16384, 65536, 102400], output_len: 1}
        threshold:
          metric: prefill_throughput
          allowed_drop_ratio: 0.10
          min_tokens_per_s:
            4096: 13741.386455854
            16384: 7447.585137071846
            65536: 16446.79676913371
            102400: 14316.030395842658
      - id: glm_5_3_flash_mxfp4_fp8_tp_decode
        preset: one_batch_decode
        engine: one_batch_server
        cache: disabled
        input: {batch_size: 64, input_len: [4096], output_len: 1536}
        threshold: {metric: output_throughput, min_tokens_per_s: 4857.48, allowed_drop_ratio: 0.10}
