name: PR Test (PPU)

# Initial t-head validation only; upstream runner/image configuration comes later.
on:
  push:
    branches: [ci/ppu-upstream-smoke]
  workflow_dispatch:
    inputs:
      build_image:
        description: "Override the native cuda-free build image"
        required: false
        type: string
      runtime_image:
        description: "Override the CUDA-compatible PPU runtime image"
        required: false
        type: string
      target_model_path:
        description: "Override the Llama-3.1-8B-Instruct checkpoint path"
        required: false
        type: string
      eagle3_model_path:
        description: "Override the EAGLE3 draft checkpoint path"
        required: false
        type: string
      dflash_model_path:
        description: "Override the DFlash draft checkpoint path"
        required: false
        type: string
      eval_cache:
        description: "Override the shared sgl-eval 0.1.2 cache path"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pr-test-ppu-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GIT_CONFIG_NOSYSTEM: "1"

jobs:
  ppu-build:
    if: github.repository == 't-head/sglang-for-sail'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      wheel-artifact-id: ${{ steps.upload-wheels.outputs.artifact-id }}
    container:
      image: ${{ inputs.build_image || 'download.t-head.cn/docker_release/pytorch:sdk2.2.0-2.13.0-ubuntu24.04-hggcrt3-py312-20261005' }}
    env:
      PPU_CI_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/build
      PPU_CI_WHEEL_DIR: ${{ github.workspace }}/wheels
      MAX_JOBS: "2"
      SGL_KERNEL_COMPILE_THREADS: "2"
    steps:
      - name: Isolate Git configuration
        run: |
          git_config="$(mktemp "${RUNNER_TEMP}/ppu-git-config.XXXXXX")"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$git_config" >> "$GITHUB_ENV"

      - name: Checkout triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build native PPU wheels
        run: |
          mkdir -p "$PPU_CI_WHEEL_DIR" "$PPU_CI_ARTIFACT_DIR"
          bash scripts/ci/ppu/build_and_test.sh build

      - name: Upload wheels and checksums
        id: upload-wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/wheels
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/artifacts/build
          if-no-files-found: warn

  ppu-sanity:
    needs: ppu-build
    if: github.repository == 't-head/sglang-for-sail'
    runs-on: k8s-runner-group-cpu-thead
    timeout-minutes: 60
    # The CPU runner only stages artifacts and orchestrates an independent Pod.
    container:
      image: ghcr.io/actions/actions-runner:latest
    env:
      PPU_CI_RUNTIME_IMAGE: ${{ inputs.runtime_image || 'reg.docker.alibaba-inc.com/ai-tmp/llm@sha256:83f3624dcdeb22f85a8608c5cb0fc1897dbd81ea442eec05f3da6095d71617a5' }}
      PPU_CI_TARGET_MODEL_PATH: ${{ inputs.target_model_path || '/nas_aisw/datasets/checkpoints/LLM/Llama/v3.1/Llama-3.1-8B-Instruct' }}
      PPU_CI_EAGLE3_MODEL_PATH: ${{ inputs.eagle3_model_path || '/nas_aisw/datasets/checkpoints/LLM/lmsys/v3.1/sglang-EAGLE3-LLaMA3.1-Instruct-8B' }}
      PPU_CI_DFLASH_MODEL_PATH: ${{ inputs.dflash_model_path || '/nas_aisw/datasets/checkpoints/LLM/z-lab/v1.0/LLaMA3.1-8B-Instruct-DFlash-UltraChat' }}
      PPU_CI_EVAL_CACHE: ${{ inputs.eval_cache || '/mnt/wl_nas/datasets/sgl_eval/0.1.2' }}
      # The scheduler forwards these job variables to the PPU Pod.
      PPU_CI_WHEEL_DIR: /workspace/source/wheels
      PPU_CI_ARTIFACT_DIR: /mnt/wl_nas/devops/sglang-ci/${{ github.run_id }}-${{ github.run_attempt }}/runtime
      SGLANG_IS_IN_CI: "1"
    steps:
      - name: Isolate Git configuration
        run: |
          git_config="$(mktemp "${RUNNER_TEMP}/ppu-git-config.XXXXXX")"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$git_config" >> "$GITHUB_ENV"

      - name: Checkout triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download wheels from this run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.ppu-build.outputs.wheel-artifact-id }}
          merge-multiple: true
          path: ${{ github.workspace }}/wheels

      - name: Run EAGLE3 and DFlash sanity tests serially on one PPU
        uses: t-head/ppu-scheduler-action@26ba21dbe66fb841192796ed990f8fd2c7997ecf
        with:
          image: ${{ env.PPU_CI_RUNTIME_IMAGE }}
          nnodes: "0"
          nproc_per_node: "1"
          namespace: ppu-sched
          node_selector: board-type=OAM-810E
          timeout_minutes: "45"
          cleanup_policy: always
          source_dir: /workspace/source
          artifact_paths: wheels
          # Keep HTTP loopback isolated; the device plugin controls card visibility.
          container_options: |
            shm_size: "16Gi"
          command: bash /workspace/source/scripts/ci/ppu/build_and_test.sh test

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-runtime-logs-${{ github.run_id }}-${{ github.run_attempt }}
          # Same NAS directory as in the Pod, available after its cleanup.
          path: /wl_nas/devops/sglang-ci/${{ github.run_id }}-${{ github.run_attempt }}/runtime
          if-no-files-found: warn

  pr-test-ppu-finish:
    needs: [ppu-build, ppu-sanity]
    if: always() && github.repository == 't-head/sglang-for-sail'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful build and both speculative sanity tests
        env:
          BUILD_RESULT: ${{ needs.ppu-build.result }}
          SANITY_RESULT: ${{ needs.ppu-sanity.result }}
        run: |
          printf 'Build: %s; speculative sanity: %s\n' "$BUILD_RESULT" "$SANITY_RESULT"
          if [[ "$BUILD_RESULT" != "success" || "$SANITY_RESULT" != "success" ]]; then
            printf '%s\n' '::error::The native build and both PPU sanity files must succeed.'
            exit 1
          fi
