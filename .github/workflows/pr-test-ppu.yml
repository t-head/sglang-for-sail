name: PR Test (PPU)

# GitHub Actions loads pull_request_target workflows from the default branch
# (sail_ci_cd). Verify PR label approval against the candidate head SHA here,
# delegate execution to the target branch's reusable workflow, and publish the
# top-level pr-test-ppu-finish status check on that PR head commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  pull_request_target:
    branches: ['yuhe/v1.0.0', 'release/v0.5.23']
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      preflight_only:
        description: "Verify Linux selftests and both cluster preflight paths"
        type: boolean
        default: false
      model_filter:
        description: "Comma-separated Fast Sanity policy keys. Empty runs all models."
        type: string
        default: ''
      run_model_sanity:
        description: "Run Nightly Model Sanity instead of Fast Sanity for selected models"
        type: boolean
        default: false
      run_all_tests:
        description: "Run Recipe CI even without PPU path changes"
        required: false
        type: boolean
        default: true
      run_legacy_sanity:
        description: "Run only the single-device DFlash and EAGLE3 checks"
        type: boolean
        default: false
  workflow_call:
    inputs:
      legacy_call:
        description: "Route reusable callers to the original PPU Extra workflow"
        type: boolean
        default: true
      ref:
        description: "Git ref to test; defaults to the triggering event SHA"
        required: false
        type: string
        default: ''
      run_all_tests:
        description: "Run Recipe CI even without PPU path changes"
        required: false
        type: boolean
        default: false
      run_legacy_sanity:
        description: "Run only the single-device DFlash and EAGLE3 checks"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: >-
    pr-test-ppu-dispatch-${{ inputs.legacy_call && 'reusable' || (inputs.run_legacy_sanity && 'legacy' || (inputs.run_model_sanity && 'model-sanity' || 'recipe')) }}-${{
      (github.event_name == 'pull_request_target' &&
       contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
       !contains(fromJSON('["run-ci","run-ci-ppu"]'), github.event.label.name)) &&
      format('ignored-label-{0}', github.run_id) ||
      github.event.pull_request.number || inputs.ref || github.ref
    }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pr-gate:
    name: >-
      ${{ (github.event_name == 'pull_request_target' && contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
           !contains(fromJSON('["run-ci","run-ci-ppu"]'), github.event.label.name)) &&
          'ignored-label-pr-gate' || 'pr-gate' }}
    if: >-
      github.event_name == 'pull_request_target' && !inputs.legacy_call &&
      (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
       contains(fromJSON('["run-ci","run-ci-ppu"]'), github.event.label.name))
    uses: ./.github/workflows/ppu-approval.yml
    with:
      label: run-ci-ppu

  release-v0523:
    needs: pr-gate
    if: >-
      github.event_name == 'pull_request_target' &&
      needs.pr-gate.outputs.approved == 'true' &&
      github.base_ref == 'release/v0.5.23'
    uses: t-head/sglang-for-sail/.github/workflows/pr-test-ppu.yml@release/v0.5.23
    with:
      ref: ${{ needs.pr-gate.outputs.sha }}
      run_all_tests: false
      run_legacy_sanity: false
    secrets:
      PPU_CI_K8S_RUNTIME_DIGEST: ${{ secrets.PPU_CI_K8S_RUNTIME_DIGEST }}
      PPU_CI_RECIPE_IMAGE_REPO: ${{ secrets.PPU_CI_RECIPE_IMAGE_REPO }}
      PPU_CI_RECIPE_ALLOWED_IMAGE_REPOS: ${{ secrets.PPU_CI_RECIPE_ALLOWED_IMAGE_REPOS }}

  yuhe-v100:
    needs: pr-gate
    if: >-
      github.event_name == 'pull_request_target' &&
      needs.pr-gate.outputs.approved == 'true' &&
      github.base_ref == 'yuhe/v1.0.0'
    uses: t-head/sglang-for-sail/.github/workflows/pr-test-ppu.yml@yuhe/v1.0.0
    with:
      ref: ${{ needs.pr-gate.outputs.sha }}
      run_all_tests: false
      run_legacy_sanity: false
    secrets:
      PPU_CI_K8S_RUNTIME_DIGEST: ${{ secrets.PPU_CI_K8S_RUNTIME_DIGEST }}
      PPU_CI_RECIPE_IMAGE_REPO: ${{ secrets.PPU_CI_RECIPE_IMAGE_REPO }}
      PPU_CI_RECIPE_ALLOWED_IMAGE_REPOS: ${{ secrets.PPU_CI_RECIPE_ALLOWED_IMAGE_REPOS }}

  legacy-call:
    # Reusable workflows inherit the event of the caller. Only workflow_call
    # declares this input, so existing callers need no changes.
    needs: require-target-branch
    if: ${{ !cancelled() && inputs.legacy_call && needs.require-target-branch.result == 'skipped' }}
    uses: ./.github/workflows/pr-test-ppu-extra.yml
    with:
      ref: ${{ inputs.ref }}
      run_all_tests: ${{ inputs.run_all_tests }}
    secrets: inherit

  require-target-branch:
    name: require-target-branch
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.legacy_call) ||
      (inputs.legacy_call && github.event.pull_request &&
       (!github.event.pull_request.head.repo.id || github.event.pull_request.head.repo.id != github.event.repository.id))
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require an active release or development branch ref
        env:
          LEGACY_CALL: ${{ inputs.legacy_call }}
        run: |
          if [[ "$LEGACY_CALL" == "true" ]]; then
            echo '::error::Fork PRs require an isolated PPU executor.'
            exit 1
          fi
          printf '%s\n' '::error::Select release/v0.5.23, yuhe/v1.0.0, or main as the workflow branch (--ref) when dispatching pr-test-ppu.yml.'
          exit 1

  pr-test-ppu-finish:
    name: >-
      ${{ (needs.pr-gate.result == 'skipped' ||
           (needs.pr-gate.result == 'success' && needs.pr-gate.outputs.skip_optional_check == 'true')) &&
          'ignored-ppu-dispatch-finish' || 'pr-test-ppu-finish' }}
    needs: [pr-gate, release-v0523, yuhe-v100]
    if: >-
      always() && needs.pr-gate.result != 'skipped' &&
      (needs.pr-gate.result != 'success' || needs.pr-gate.outputs.skip_optional_check != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: scripts/ci/ppu
          persist-credentials: false
      - name: Require Fast Sanity results for the approved PR head
        uses: actions/github-script@v8
        env:
          PPU_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const finish = require('./scripts/ci/ppu/ppu_pr_result.cjs');
            await finish({github, context, needs: JSON.parse(process.env.PPU_NEEDS)});
