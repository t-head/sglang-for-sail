name: PR Test (PPU)

# GitHub Actions only registers pull_request_target and workflow_dispatch event
# subscriptions when the workflow exists on the default branch (sail_ci_cd).
# Actual PR and dispatch runs execute the workflow definition from the target
# base branch (for example release/v0.5.23, yuhe/v1.0.0, or main).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  pull_request_target:
    branches: ['yuhe/v1.0.0', 'release/**']
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      preflight_only:
        description: "Verify Linux selftests and both cluster preflight paths"
        type: boolean
        default: false
      model_filter:
        description: "Comma-separated Fast Sanity policy keys. Empty runs all models."
        type: string
        default: ''
      run_model_sanity:
        description: "Run Nightly Model Sanity instead of Fast Sanity for selected models"
        type: boolean
        default: false
      run_all_tests:
        description: "Run Recipe CI even without PPU path changes"
        required: false
        type: boolean
        default: true
      run_legacy_sanity:
        description: "Run only the single-device DFlash and EAGLE3 checks"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test; defaults to the triggering event SHA"
        required: false
        type: string
        default: ''
      run_all_tests:
        description: "Run Recipe CI even without PPU path changes"
        required: false
        type: boolean
        default: false
      run_legacy_sanity:
        description: "Run only the single-device DFlash and EAGLE3 checks"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  require-target-branch:
    name: require-target-branch
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require an active release or development branch ref
        run: |
          printf '%s\n' '::error::Select release/v0.5.23, yuhe/v1.0.0, or main as the workflow branch (--ref); sail_ci_cd only registers the default-branch trigger schema.'
          exit 1
