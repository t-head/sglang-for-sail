name: PR Test (PPU)

on:
  push:
    branches: [ main ]
  # Use the protected base branch's workflow for privileged runner jobs.
  pull_request_target:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      run_all_tests:
        description: "Run Recipe CI even without PPU path changes"
        required: false
        type: boolean
        default: true
      run_legacy_sanity:
        description: "Run only the single-device DFlash and EAGLE3 checks"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test; defaults to the triggering event SHA"
        required: false
        type: string
        default: ''
      run_all_tests:
        description: "Run Recipe CI even without PPU path changes"
        required: false
        type: boolean
        default: false
      run_legacy_sanity:
        description: "Run only the single-device DFlash and EAGLE3 checks"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  # Keep legacy-only runs and unrelated label events separate from Recipe CI.
  group: >-
    pr-test-ppu-${{ inputs.run_legacy_sanity && 'legacy' || 'recipe' }}-${{
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'labeled' &&
       github.event.label.name != 'run-ci-ppu') &&
      format('ignored-label-{0}', github.run_id) ||
      github.event.pull_request.number || inputs.ref || github.ref
    }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PPU_CI_K8S_CONFIG_SHA256: '180dcea0645c98f89109617547ce31000d4cd84850cd3fdfb7771030985962ec'
  GIT_CONFIG_NOSYSTEM: "1"

jobs:
  check-changes:
    name: >-
      ${{ (github.event_name == 'pull_request_target' && github.event.action == 'labeled' &&
           github.event.label.name != 'run-ci-ppu') &&
          'ignored-label-check-changes' || 'check-changes' }}
    if: |
      github.event_name != 'pull_request_target' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'run-ci-ppu'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ppu: >-
        ${{ inputs.run_legacy_sanity || steps.filter.outputs.ppu == 'true' ||
          steps.run-mode.outputs.run_all_tests == 'true' ||
          (github.event_name == 'pull_request_target' &&
           (contains(github.event.pull_request.labels.*.name, 'run-ci-ppu') ||
            (github.event.action == 'labeled' && github.event.label.name == 'run-ci-ppu') ||
            (startsWith(github.base_ref, 'release/') && steps.filter.outputs.release-code == 'true'))) }}
      source-sha: ${{ github.event.pull_request.head.sha || steps.source.outputs.sha }}
    steps:
      - name: Checkout the non-PR source
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Pin the source revision for every job
        id: source
        if: github.event_name != 'pull_request_target'
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine run mode
        id: run-mode
        env:
          RUN_ALL_TESTS: ${{ inputs.run_all_tests || inputs.run_legacy_sanity }}
        run: |
          if [[ "$RUN_ALL_TESTS" == "true" ]]; then
            echo "run_all_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_all_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        if: steps.run-mode.outputs.run_all_tests != 'true'
        with:
          filters: |
            ppu:
              - ".github/workflows/pr-test-ppu.yml"
              - ".github/workflows/nightly-test-ppu.yml"
              - "scripts/ci/ppu/**"
              - "test/ppu/**"
              - "python/sglang/srt/platforms/sail.py"
              - "python/sglang/kernels/aot/setup_sail.py"
              - "python/sglang/kernels/aot/pyproject_sail.toml"
              - "python/sglang/kernels/aot/csrc/common_extension_sail.cc"
              - "python/sglang/kernels/jit/utils/compile/sailify.py"
            release-code:
              - "python/sglang/**"
              - "sgl-kernel/**"

  pr-gate:
    name: >-
      ${{ (github.event_name == 'pull_request_target' && github.event.action == 'labeled' &&
           github.event.label.name != 'run-ci-ppu') &&
          'ignored-label-pr-gate' || 'pr-gate' }}
    needs: check-changes
    if: needs.check-changes.outputs.ppu == 'true'
    uses: ./.github/workflows/pr-gate.yml
    with:
      require-run-ci: true
      require-label: run-ci-ppu
      require-fresh-label: true

  ppu-ci-selftest:
    needs: [check-changes, pr-gate]
    if: needs.check-changes.outputs.ppu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ needs.check-changes.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Recipe and PPU infrastructure selftests
        run: |
          python3 -m pip install --quiet PyYAML huggingface-hub
          python3 -B -m unittest discover -s scripts/ci/ppu -p 'test_recipe*.py'
          bash scripts/ci/ppu/run_selftests.sh

  ppu-cluster-config:
    name: ppu-cluster-config
    needs: [check-changes, ppu-ci-selftest]
    if: github.repository == 't-head/sglang-for-sail' && needs.check-changes.outputs.ppu == 'true'
    runs-on:
      group: sglang-ppu-ci
      labels: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ needs.check-changes.outputs.source-sha }}
          persist-credentials: false
      - name: Fetch pinned Cluster Run backend
        uses: actions/checkout@v4
        with:
          repository: t-head/ci-infra
          ref: 96e25147971f5d2a04d828f8ad508cae38a4fa8a
          path: .ppu-infra
          persist-credentials: false
      - name: Verify the private staging configuration
        run: python3 -B scripts/ci/ppu/recipe_cluster_config.py --check

  ppu-build:
    name: >-
      ${{ (github.event_name == 'pull_request_target' && github.event.action == 'labeled' &&
           github.event.label.name != 'run-ci-ppu') &&
          'ignored-label-ppu-build' || 'ppu-build' }}
    needs: [check-changes, ppu-ci-selftest]
    if: needs.check-changes.outputs.ppu == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    container:
      image: download.t-head.cn/docker_release/pytorch:sdk2.2.0-2.13.0-ubuntu24.04-hggcrt3-py312-20261005
    env:
      PPU_CI_SOURCE_SHA: ${{ needs.check-changes.outputs.source-sha }}
      MAX_JOBS: "2"
      SGL_KERNEL_COMPILE_THREADS: "2"
    outputs:
      wheel-artifact-id: ${{ steps.wheels.outputs.artifact-id }}
    steps:
      - name: Initialize private build directories and Git configuration
        run: |
          work="$(mktemp -d "${RUNNER_TEMP}/ppu-build.XXXXXX")"
          touch "$work/gitconfig"
          mkdir "$work/wheels" "$work/artifacts"
          {
            printf 'GIT_CONFIG_GLOBAL=%s\n' "$work/gitconfig"
            printf 'PPU_CI_WHEEL_DIR=%s\n' "$work/wheels"
            printf 'PPU_CI_ARTIFACT_DIR=%s\n' "$work/artifacts"
          } >> "$GITHUB_ENV"

      # Build the exact commit selected on the hosted runner and, for PRs,
      # approved by the fresh label event.
      - name: Checkout the triggering source revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ needs.check-changes.outputs.source-sha }}
          persist-credentials: false

      - name: Build native SAIL wheels
        run: |
          mkdir -p "$PPU_CI_WHEEL_DIR"
          if ! bash scripts/ci/ppu/build_and_test.sh build > "$PPU_CI_ARTIFACT_DIR/launcher.log" 2>&1; then
            echo "::error::Native SAIL wheel build failed"
            exit 1
          fi
          if ! python3 -B scripts/ci/ppu/recipe_bundle.py pack "$PPU_CI_WHEEL_DIR" "$PPU_CI_SOURCE_SHA" > "$PPU_CI_ARTIFACT_DIR/pack.log" 2>&1; then
            echo "::error::Candidate recipe packaging failed"
            exit 1
          fi

      - name: Upload PPU wheels
        id: wheels
        uses: actions/upload-artifact@v4
        with:
          name: ppu-wheels-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.check-changes.outputs.source-sha }}
          path: ${{ env.PPU_CI_WHEEL_DIR }}
          if-no-files-found: error

  ppu-legacy-sanity:
    name: ppu-legacy-sanity (${{ matrix.board }})
    needs: [check-changes, pr-gate, ppu-build, ppu-cluster-config]
    if: inputs.run_legacy_sanity == true && needs.check-changes.outputs.ppu == 'true'
    strategy:
      fail-fast: false
      matrix:
        board: [ZW-M890P, OAM-810E]
    runs-on:
      group: sglang-ppu-ci
      labels: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      TIER: legacy
      PPU_CI_BOARD: ${{ matrix.board }}
      PPU_CI_SOURCE_SHA: ${{ needs.check-changes.outputs.source-sha }}
    steps:
      - name: Checkout the triggering source revision
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ needs.check-changes.outputs.source-sha }}
          persist-credentials: false
      - name: Download the matching PPU wheel artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.ppu-build.outputs.wheel-artifact-id }}
          merge-multiple: true
          path: wheels
      - name: Fetch pinned Cluster Run backend
        uses: actions/checkout@v4
        with:
          repository: t-head/ci-infra
          ref: 96e25147971f5d2a04d828f8ad508cae38a4fa8a
          path: .ppu-infra
          persist-credentials: false
      - name: Orchestrate PPU Pod with private logs
        id: cluster
        shell: bash
        run: |
          export PPU_PUBLIC_SUMMARY="$GITHUB_STEP_SUMMARY"
          exec bash scripts/ci/ppu/run_recipe_cluster.sh
      - name: Approve only the checked single-device evidence file
        id: evidence
        if: always() && steps.cluster.outcome != 'skipped'
        shell: bash
        run: |
          if [[ -f ppu-public/legacy.json && ! -L ppu-public/legacy.json ]] &&
            python3 -B scripts/ci/ppu/recipe_publish.py --verify-only ppu-public/legacy.json >/dev/null 2>&1; then
            printf 'approved=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload checked single-device evidence
        if: always() && steps.evidence.outputs.approved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: legacy-sanity-${{ matrix.board }}-${{ github.run_attempt }}
          path: ppu-public/legacy.json
          if-no-files-found: error

  ppu-fast-sanity:
    needs: [check-changes, pr-gate, ppu-build, ppu-cluster-config]
    if: >-
      !cancelled() && inputs.run_legacy_sanity != true &&
      needs.ppu-build.result == 'success' &&
      needs.ppu-cluster-config.result == 'success' &&
      needs.check-changes.outputs.ppu == 'true'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/nightly-test-ppu.yml
    with:
      ref: ${{ needs.check-changes.outputs.source-sha }}
      tier: fast_sanity
      skip_wheel_build: true
      wheel_artifact_id: ${{ needs.ppu-build.outputs.wheel-artifact-id }}

  pr-test-ppu-finish:
    name: >-
      ${{ inputs.run_legacy_sanity && 'legacy-only-pr-test-ppu-finish' ||
          ((github.event_name == 'pull_request_target' && github.event.action == 'labeled' &&
            github.event.label.name != 'run-ci-ppu') &&
           'ignored-label-pr-test-ppu-finish' || 'pr-test-ppu-finish') }}
    needs: [pr-gate, check-changes, ppu-ci-selftest, ppu-build, ppu-cluster-config, ppu-fast-sanity]
    if: always() && inputs.run_legacy_sanity != true && needs.check-changes.result != 'skipped'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful Linux selftests, native build, runner preflight and Recipe Fast Sanity
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          PPU_IN_SCOPE: ${{ needs.check-changes.outputs.ppu }}
        run: |
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<< "$NEEDS_JSON" >/dev/null; then
            printf '%s\n' '::error::A PPU CI dependency failed or was cancelled.'
            exit 1
          fi
          if [[ "$PPU_IN_SCOPE" == "true" ]]; then
            if ! jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON" >/dev/null; then
              printf '%s\n' '::error::PPU scope requires successful Linux selftests, native build, runner preflight and Recipe Fast Sanity.'
              exit 1
            fi
            printf '%s\n' 'Linux selftests, native build, runner preflight and Recipe Fast Sanity passed.'
          else
            printf '%s\n' 'PPU is outside this run scope; no PPU tests were requested.'
          fi
